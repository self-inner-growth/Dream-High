<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>드림하이 : 핵심욕구</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
  <style>
    :root { 
      --primary: #2c3e50; --accent: #3498db; --bg: #f4f6f9; 
      --text: #2c3e50; --growth: #27ae60; --stress: #e74c3c; 
    }
    body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; padding: 20px 10px; color: var(--text); display: flex; justify-content: center; }
    .container { position: relative; max-width: 900px; width: 100%; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); min-height: 500px; }
    
    #main-app, #result-area { display: none; }
    #landing-page { text-align: center; }
    .landing-image { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; margin-bottom: 25px; }
    .landing-title { font-size: 1.8rem; color: var(--primary); margin-bottom: 10px; font-weight: 800; }
    .landing-desc { color: #666; margin-bottom: 30px; font-size: 1rem; line-height: 1.6; }
    
    .input-group { text-align: left; margin-bottom: 15px; }
    .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 0.9rem; }
    .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    .start-btn, .action-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #2c3e50, #34495e); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 20px; transition: 0.2s;}
    .start-btn:hover, .action-btn:hover { opacity: 0.9; }
    
    h1 { text-align: center; color: var(--primary); margin-bottom: 10px; font-size: 1.8rem; }
    h3 { border-left: 4px solid var(--accent); padding-left: 10px; margin-top: 30px; margin-bottom: 15px; color: var(--primary); font-size: 1.2rem; }
    
    .question-box { background: #fff; margin-bottom: 15px; padding: 20px 0; animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .question-text { font-weight: 700; display: block; margin-bottom: 30px; font-size: 1.3rem; text-align: center; line-height: 1.5; color: #111;}
    
    .options { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; border: none; }
    .option-label { flex: 0 1 auto; cursor: pointer; text-align: center; }
    .option-label input { display: none; }
    .btn-text { padding: 12px 22px; background: #fff; border: 2px solid #e0e0e0; border-radius: 30px; font-size: 1rem; color: #555; transition: 0.2s; word-break: keep-all; font-weight: 500;}
    .option-label input:checked + .btn-text { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
    .option-label:hover .btn-text { border-color: var(--primary); background: #f8f9fa; }
    .option-label input:checked:hover + .btn-text { background: var(--primary); }

    .one-liner-box { background: linear-gradient(135deg, #34495e, #2c3e50); color: white; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    .one-liner-main { font-size: 2rem; font-weight: 800; margin: 10px 0; color: #3498db; }
    .rank-container { display: flex; gap: 15px; margin: 15px 0; }
    .rank-box { flex: 1; padding: 15px; border: 1px solid #eee; border-radius: 8px; background: #fafafa;}
    .rank-title { display: block; margin-bottom: 10px; font-weight: bold; font-size: 1rem; border-bottom: 2px solid #eee; padding-bottom:5px; }
    .rank-title.blue { color: #2980b9; }
    .rank-item { margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px dashed #e0e0e0; font-size: 0.95rem; display:flex; justify-content:space-between;}
    .detail-table { width: 100%; border-collapse: collapse; margin-top: 10px; border-top: 2px solid var(--primary); font-size: 0.85rem; }
    .detail-table th { background: #f8f9fa; padding: 8px; text-align: left; font-weight: bold; color: var(--primary); }
    .detail-table td { padding: 8px; border-bottom: 1px solid #eee; }
    .flex-row-desktop { display: flex; gap: 20px; margin-top: 20px; }
    .flex-row-desktop > div { flex: 1; min-width: 0; }
    .ai-result-grid { display: flex; gap: 15px; margin-top: 15px; }
    .ai-box { flex: 1; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .ai-box h4 { margin: 0 0 10px 0; font-size: 1rem; padding-bottom: 8px; border-bottom: 2px solid #eee; }
    .ai-box p { font-size: 0.9rem; color: #444; line-height: 1.6; margin: 0; white-space: pre-wrap; }
    .ai-btn { background: linear-gradient(135deg, #2980b9 0%, #2c3e50 100%); color: white; padding: 12px 30px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; }
    
    #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { width: 40px; height: 40px; border: 4px solid #eee; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    @media (max-width: 700px) {
      .container { padding: 20px 15px; }
      .options { flex-direction: column; gap: 8px; }
      .option-label { width: 100%; }
      .btn-text { width: 100%; box-sizing: border-box; }
      .flex-row-desktop, .rank-container, .ai-result-grid { flex-direction: column; gap: 15px; }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <h3>처리 중...</h3>
  </div>

  <div class="container">
    <div id="landing-page">
      <!-- 구글 드라이브나 외부 저장소에 업로드된 이미지 링크 -->
      <img src="https://images.unsplash.com/photo-1509803874385-db7c23652552?auto=format&fit=crop&w=800&q=80" class="landing-image" alt="드림하이 배경 이미지">
      
      <h1 class="landing-title">드림하이 : 핵심욕구</h1>
      <p class="landing-desc">
        정밀한 심리 분석과 전문적인 리포트 제공을 위해<br>
        기본 정보를 입력해 주세요. (입력하신 정보는 철저히 비밀이 보장됩니다.)
      </p>

      <div class="input-group">
        <label>이름</label>
        <input type="text" id="user-name" placeholder="예: 홍길동" autocomplete="off">
      </div>
      
      <div style="display:flex; gap:10px;">
        <div class="input-group" style="flex:1;">
          <label>나이</label>
          <input type="number" id="user-age" placeholder="예: 25" autocomplete="off">
        </div>
        <div class="input-group" style="flex:1;">
          <label>성별</label>
          <select id="user-gender" style="height:44px;">
            <option value="남성">남성</option>
            <option value="여성">여성</option>
          </select>
        </div>
      </div>

      <div class="input-group">
        <label>MBTI (선택)</label>
        <select id="user-mbti" style="height:44px;">
          <option value="">모름 / 선택안함</option>
          <option value="ISTJ">ISTJ</option><option value="ISFJ">ISFJ</option><option value="INFJ">INFJ</option><option value="INTJ">INTJ</option>
          <option value="ISTP">ISTP</option><option value="ISFP">ISFP</option><option value="INFP">INFP</option><option value="INTP">INTP</option>
          <option value="ESTP">ESTP</option><option value="ESFP">ESFP</option><option value="ENFP">ENFP</option><option value="ENTP">ENTP</option>
          <option value="ESTJ">ESTJ</option><option value="ESFJ">ESFJ</option><option value="ENFJ">ENFJ</option><option value="ENTJ">ENTJ</option>
        </select>
      </div>

      <button class="start-btn" onclick="startTest()">검사 시작하기</button>
    </div>

    <!-- 검사 진행 화면 -->
    <div id="main-app">
      <div id="quiz-area">
        <h1 id="main-title" style="margin-bottom: 30px;">나의 핵심욕구 프로파일</h1>
        
        <div style="width: 100%; background: #e0e0e0; border-radius: 10px; height: 8px; margin-bottom: 10px; overflow:hidden;">
           <div id="progress-bar" style="width: 0%; background: var(--accent); height: 100%; border-radius: 10px; transition: width 0.3s ease;"></div>
        </div>
        <div id="progress-text" style="text-align:right; color:#888; font-size:0.85rem; margin-bottom:20px; font-weight:bold;">1 / 20</div>

        <form id="quiz-form"></form>
      </div>
      <div id="result-area"></div>
    </div>
  </div>

  <script>
    // =========================================================
    // ★ 앱스 스크립트 배포 후 생성된 '웹 앱 URL'을 아래에 붙여넣으세요.
    // =========================================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyUvCIxFES9ASZmOjz9DM3cGeI3ZdcaqRU0ppsDFmpuCduGLKz7zb08olnFouzkzxKQzQ/exec';

    const needsDescriptionMap = {
      "안정": "안전과 예측 가능성을 중시하며, 위험을 최소화하고 평온한 상태를 유지하려는 욕구가 큽니다.",
      "인정": "타인으로부터의 긍정적인 평가와 존중, 가치를 인정받고자 하는 욕구가 큽니다.",
      "관계": "사람들과의 깊은 정서적 교류, 소속감, 친밀한 유대감을 형성하려는 욕구가 큽니다.",
      "자율": "독립적으로 사고하고 행동하며, 자신의 삶을 통제하고 간섭받지 않으려는 욕구가 큽니다.",
      "성취의미": "성장과 발전, 그리고 자신의 행동이나 삶에서 깊은 가치와 의미를 찾으려는 욕구가 큽니다."
    };

    let userInfo = {};
    let finalResultData = null;
    let rawQuestions = []; 
    let currentDetailList = [];
    let sortState = { col: 'score', order: 'desc' };
    let currentQIndex = 0;
    let userAnswers = []; 

    // 외부 API 호출 헬퍼 함수
    async function callBackend(action, payload = null) {
      let url = SCRIPT_URL + "?action=" + action;
      let options = { redirect: "follow" };
      
      if (payload) {
        options.method = "POST";
        // CORS 프리플라이트를 피하기 위해 text/plain 사용
        options.headers = { "Content-Type": "text/plain;charset=utf-8" };
        options.body = JSON.stringify(payload);
      } else {
        options.method = "GET";
      }
      
      try {
        let response = await fetch(url, options);
        return await response.json();
      } catch (error) {
        throw new Error("서버 통신 실패: " + error.message);
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      setupTestCheat();

      const params = new URLSearchParams(window.location.search);
      const testId = params.get('id');

      if (testId) {
        document.getElementById('loading-overlay').style.display = 'flex';
        callBackend('getDataById&id=' + testId)
          .then(data => {
            document.getElementById('loading-overlay').style.display = 'none';
            if (data && data.scores) restoreResultScreen(data);
          })
          .catch(() => document.getElementById('loading-overlay').style.display = 'none');
      } else if (localStorage.getItem('ksip_last_result')) {
        try {
          const localData = JSON.parse(localStorage.getItem('ksip_last_result'));
          if (!localData || !localData.scores) throw new Error("데이터 손상");
          restoreResultScreen(localData);
        } catch(e) {
          localStorage.removeItem('ksip_last_result');
        }
      } else if (sessionStorage.getItem('ksip_status') === 'quiz') {
        fetchQuestionsAndRestoreSession();
      }
    });

    function startTest() {
      const name = document.getElementById('user-name').value;
      const age = document.getElementById('user-age').value;
      
      if (!name || !age) { alert('이름과 나이를 모두 입력해 주세요.'); return; }

      const btn = document.querySelector('.start-btn');
      btn.innerText = "문항지 불러오는 중...";
      btn.disabled = true;

      callBackend('getQuestions')
        .then(questions => {
          rawQuestions = questions;
          const gender = document.getElementById('user-gender').value;
          const mbti = document.getElementById('user-mbti').value;
          
          userInfo = { name, age, gender, mbti: mbti || "알수없음" };
          
          localStorage.removeItem('ksip_last_result');
          sessionStorage.setItem('ksip_status', 'quiz');
          sessionStorage.setItem('ksip_userInfo', JSON.stringify(userInfo));

          initQuiz(); 
          
          document.getElementById('landing-page').style.display = 'none';
          document.getElementById('main-app').style.display = 'block';
          window.scrollTo(0,0);
          
          btn.innerText = "검사 시작하기";
          btn.disabled = false;
        })
        .catch(err => {
          alert(err);
          btn.innerText = "검사 시작하기";
          btn.disabled = false;
        });
    }

    function fetchQuestionsAndRestoreSession() {
      callBackend('getQuestions').then(questions => {
        rawQuestions = questions;
        try {
          const storedUser = JSON.parse(sessionStorage.getItem('ksip_userInfo'));
          if (storedUser) {
            userInfo = storedUser;
            document.getElementById('user-name').value = userInfo.name;
            document.getElementById('user-age').value = userInfo.age;
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            initQuiz();
          }
        } catch (e) {}
      });
    }

    function initQuiz() {
      for (let i = rawQuestions.length - 1; i > 0; i--) { 
        const j = Math.floor(Math.random() * (i + 1)); 
        [rawQuestions[i], rawQuestions[j]] = [rawQuestions[j], rawQuestions[i]]; 
      }
      currentQIndex = 0;
      userAnswers = new Array(rawQuestions.length).fill(0);
      renderQuestion();
    }

    function renderQuestion() {
      if (currentQIndex >= rawQuestions.length) {
        calculateResult();
        return;
      }

      const item = rawQuestions[currentQIndex];
      const percent = ((currentQIndex) / rawQuestions.length) * 100;
      
      document.getElementById('progress-bar').style.width = percent + '%';
      document.getElementById('progress-text').innerText = `${currentQIndex + 1} / ${rawQuestions.length}`;

      const container = document.getElementById('quiz-form');
      container.innerHTML = `
        <div class="question-box">
          <span class="question-text">${item.q}</span>
          <div class="options">
            ${[1,2,3,4,5].map(v => {
              let labelText = v === 1 ? "전혀 그렇지 않다" : v === 2 ? "그렇지 않은 편이다" : v === 3 ? "보통이다" : v === 4 ? "그런 편이다" : "매우 그렇다";
              return `<label class="option-label">
                        <input type="radio" name="q_current" value="${v}" onclick="handleAnswer(${v})">
                        <div class="btn-text">${labelText}</div>
                      </label>`;
            }).join('')}
          </div>
        </div>
      `;
    }

    function handleAnswer(val) {
      userAnswers[currentQIndex] = val;
      setTimeout(() => {
        currentQIndex++;
        renderQuestion();
      }, 250); 
    }

    function calculateResult() {
      let scores = { "안정":0, "인정":0, "관계":0, "자율":0, "성취의미":0 };
      let compressedResponses = []; 
      let displayResponses = []; 

      for(let i=0; i<rawQuestions.length; i++) {
        const val = userAnswers[i];
        const type = rawQuestions[i].type;
        const text = rawQuestions[i].q;
        scores[type] += val;
        compressedResponses.push({ i: i, v: val, t: type, text: text });
        displayResponses.push({ text: text, score: val, type: type });
      }

      document.getElementById('loading-overlay').style.display = 'flex';
      
      let typeScores = [
        { id: "안정", score: scores["안정"] },
        { id: "인정", score: scores["인정"] },
        { id: "관계", score: scores["관계"] },
        { id: "자율", score: scores["자율"] },
        { id: "성취의미", score: scores["성취의미"] }
      ];
      typeScores.sort((a, b) => b.score - a.score);
      const topTypeStr = typeScores[0].id;
      
      finalResultData = { 
        scores: scores, 
        topType: topTypeStr, 
        userInfo: userInfo, 
        userResponses: compressedResponses 
      };

      callBackend('saveData', finalResultData)
        .then(res => {
          document.getElementById('loading-overlay').style.display = 'none';
          if (res.success && res.id) {
            finalResultData.id = res.id;
            localStorage.setItem('ksip_last_result', JSON.stringify(finalResultData));
            if (history.replaceState) history.replaceState(null, null, "?id=" + res.id);
          }
          sessionStorage.removeItem('ksip_status'); 
          showResultScreen(scores, typeScores, topTypeStr, displayResponses);
        })
        .catch(err => {
          document.getElementById('loading-overlay').style.display = 'none';
          alert("저장 오류: " + err);
        });
    }

    function restoreResultScreen(data) {
      finalResultData = data;
      document.getElementById('landing-page').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      
      const scores = data.scores;
      let typeScores = [
        { id: "안정", score: scores["안정"] || 0 },
        { id: "인정", score: scores["인정"] || 0 },
        { id: "관계", score: scores["관계"] || 0 },
        { id: "자율", score: scores["자율"] || 0 },
        { id: "성취의미", score: scores["성취의미"] || 0 }
      ];
      typeScores.sort((a, b) => b.score - a.score);
      const topTypeStr = data.topType || typeScores[0].id;

      let fullUserResponses = [];
      if (data.userResponses) {
        fullUserResponses = data.userResponses.map(item => ({
          text: item.text || "-", type: item.t || "?", score: item.v || item.score
        }));
      }
      if(data.aiResult) window.savedAiResult = data.aiResult;
      
      showResultScreen(scores, typeScores, topTypeStr, fullUserResponses);
    }

    function setupTestCheat() {
      let clickCount = 0;
      const mainTitle = document.getElementById('main-title');
      if (mainTitle) {
        mainTitle.style.cursor = "pointer";
        mainTitle.title = "테스트용";
        mainTitle.addEventListener('click', function() {
          if (++clickCount === 3) {
            for(let i=0; i<rawQuestions.length; i++) {
                userAnswers[i] = Math.floor(Math.random() * 5) + 1;
            }
            alert('⚡ 테스트 응답 자동 생성 완료');
            calculateResult();
            clickCount = 0;
          }
        });
      }
    }

    function showResultScreen(scores, typeScores, topTypeStr, userResponses) {
      document.getElementById('quiz-area').style.display = 'none';
      const resultArea = document.getElementById('result-area');
      resultArea.style.display = 'block';
      
      window.mentorData = { scores, typeScores, topTypeStr, userResponses };

      resultArea.innerHTML = `
        <div style="background: #fff; padding: 40px 20px; border-radius: 12px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 50px; margin-bottom: 20px;">🎉</div>
            <h2 style="color: #2c3e50; margin-bottom: 15px;">검사가 완료되었습니다!</h2>
            <p style="color: #555; font-size: 1.05rem; line-height: 1.6; word-break: keep-all;">
                수고하셨습니다. 응답하신 내용은 안전하게 저장되었습니다.<br><br>
                상세한 심리 검사 결과 및 분석은<br>
                <b style="color:var(--accent);">담당 멘토 쌤을 통해서 직접 안내</b>받으실 수 있습니다.
            </p>
        </div>
        
        <div style="margin-top:40px; text-align:center;">
          <button style="background: transparent; border: none; color: #aaa; text-decoration: underline; cursor: pointer; font-size: 0.85rem;" onclick="toggleMentorLogin()">멘토 전용 결과 확인</button>
        </div>

        <div id="mentor-login-area" style="display:none; margin-top:20px; text-align:center; background: #f8f9fa; padding: 20px; border-radius: 8px;">
           <label style="display:block; font-size:0.85rem; color:#666; margin-bottom:8px;">멘토 확인용 아이디를 입력해주세요</label>
           <input type="password" id="mentor-id-input" placeholder="아이디 입력" style="padding:10px; border:1px solid #ccc; border-radius:5px; width:150px; text-align:center;">
           <button id="mentor-btn" onclick="verifyMentor()" style="padding:10px 15px; background:#2c3e50; color:#fff; border:none; border-radius:5px; cursor:pointer;">확인</button>
        </div>
        
        <div id="detailed-result-area" style="display:none; margin-top: 30px;"></div>
      `;
      window.scrollTo(0,0);
    }

    function toggleMentorLogin() {
      const el = document.getElementById('mentor-login-area');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function verifyMentor() {
      const inputId = document.getElementById('mentor-id-input').value;
      if (!inputId) { alert("아이디를 입력해주세요."); return; }
      
      const btn = document.getElementById('mentor-btn');
      const originalText = btn.innerText;
      btn.innerText = "확인 중...";
      btn.disabled = true;

      callBackend('verifyMentor', { id: inputId })
        .then(isValid => {
          btn.innerText = originalText;
          btn.disabled = false;
          
          if (isValid) {
            document.getElementById('mentor-login-area').style.display = 'none';
            document.querySelector('#result-area > div:first-child').style.display = 'none';
            document.querySelector('#result-area > div:nth-child(2)').style.display = 'none';
            
            const detailArea = document.getElementById('detailed-result-area');
            detailArea.style.display = 'block';
            
            renderDetailedResults(window.mentorData);
          } else {
            alert("멘토 아이디가 일치하지 않습니다.");
          }
        })
        .catch(err => {
          btn.innerText = originalText;
          btn.disabled = false;
          alert("서버 오류가 발생했습니다.");
        });
    }

    function renderDetailedResults(data) {
      const { scores, typeScores, topTypeStr, userResponses } = data;
      const detailArea = document.getElementById('detailed-result-area');
      
      currentDetailList = userResponses || [];
      let displayTopType = topTypeStr === "성취의미" ? "성취·의미" : topTypeStr;

      detailArea.innerHTML = `
        <div style="padding: 5px; background: white;">
          <h1 style="color:#2c3e50; border-bottom:2px solid #2c3e50; padding-bottom:10px;">핵심욕구 프로파일 (멘토용)</h1>
          <div class="one-liner-box">
             <div style="color:#bdc3c7; font-size:1.2rem;">가장 강한 핵심 욕구</div>
             <div class="one-liner-main">${displayTopType}</div>
             <div style="color:#ecf0f1; margin-top:10px; font-size:1rem; line-height:1.5;">
               ${needsDescriptionMap[topTypeStr]}
             </div>
          </div>
          <div class="flex-row-desktop">
            <div>
               <h3>1. 핵심욕구 우선순위</h3>
               <div class="rank-container" style="flex-direction:column; gap:10px;">
                 <div class="rank-box">
                   <span class="rank-title blue">학생 주요 욕구 분포</span>
                   <div id="high-rank-list"></div>
                 </div>
               </div>
            </div>
            <div>
               <h3>2. 5대 핵심욕구 밸런스</h3>
               <div style="position: relative; height:220px; width:100%;"><canvas id="centerChart"></canvas></div>
            </div>
          </div>

          <div style="margin-top: 30px;">
             <h3>3. 전체 욕구 점수 분포도</h3>
             <div style="position: relative; height:250px; width:100%;"><canvas id="resultChart"></canvas></div>
          </div>
          <div id="ai-section" style="margin-top: 35px;">
             <h3>4. AI 심층 분석 리포트</h3>
             <div id="ai-initial-view" style="text-align:center; padding:25px; background:#f8f9fa; border:1px solid #eee; border-radius:10px;">
                <p style="margin-bottom:15px;">전문적인 심층 분석과 조언을 제공합니다.</p>
                <button id="ai-btn" class="ai-btn" onclick="callAI()">AI 정밀 분석 시작하기</button>
             </div>
             <div id="ai-loading" style="display:none; text-align:center; padding:30px;"><div class="spinner" style="margin:0 auto 15px auto;"></div><p>AI가 분석 중입니다...</p></div>
             <div id="ai-result-box" style="display:none;"></div>
          </div>
          
          <div style="margin-top:40px;">
             <h3>5. 문항별 응답 상세 <span style="font-size:0.8rem; color:#999; font-weight:normal;">(헤더 더블 클릭: 정렬)</span></h3>
             <table class="detail-table">
               <thead>
                 <tr>
                   <th width="15%" style="cursor:pointer;" ondblclick="toggleSort('type')" title="더블클릭하여 정렬">유형 <span id="sort-icon-type" style="font-size:0.8rem">↕</span></th>
                   <th>문항 내용</th>
                   <th width="15%" style="cursor:pointer;" ondblclick="toggleSort('score')" title="더블클릭하여 정렬">선택 <span id="sort-icon-score" style="font-size:0.8rem; color:#2980b9;">▼</span></th>
                 </tr>
               </thead>
               <tbody id="detail-tbody"></tbody>
             </table>
          </div>
        </div>
        <div style="margin-top:30px; text-align:center;">
          <button class="action-btn" style="background:#95a5a6;" onclick="resetTest()">초기화 및 새 검사 시작</button>
        </div>
      `;

      document.getElementById('high-rank-list').innerHTML = typeScores.map((t,i) => {
        let name = t.id === "성취의미" ? "성취·의미" : t.id;
        let boldStyle = i === 0 ? "font-weight:800; color:#c0392b;" : "";
        return `<div class="rank-item" style="${boldStyle}"><span>${i+1}위: <b>${name}</b></span> <span>${t.score}점</span></div>`;
      }).join('');
      
      new Chart(document.getElementById('centerChart'), {
        type: 'radar',
        data: { 
          labels: ['안정', '인정', '관계', '자율', '성취·의미'], 
          datasets: [{ 
            label: '점수', 
            data: [scores['안정'], scores['인정'], scores['관계'], scores['자율'], scores['성취의미']], 
            backgroundColor: 'rgba(52, 152, 219, 0.2)', 
            borderColor: '#3498db',
            pointBackgroundColor: '#2980b9'
          }] 
        },
        options: { responsive: true, maintainAspectRatio: false, scale: { ticks: { beginAtZero: true, max: 20, display: false } }, legend: { display: false } }
      });

      new Chart(document.getElementById('resultChart'), {
        type: 'bar',
        data: { 
          labels: ['안정', '인정', '관계', '자율', '성취·의미'], 
          datasets: [{ 
            label: '점수', 
            data: [scores['안정'], scores['인정'], scores['관계'], scores['자율'], scores['성취의미']], 
            backgroundColor: '#2c3e50' 
          }] 
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { yAxes: [{ ticks: { beginAtZero: true, max: 20 } }] }, legend: { display: false } }
      });

      applySort();

      if(window.savedAiResult) {
          renderAIResult(window.savedAiResult);
          document.getElementById('ai-btn').style.display = 'none';
      }
    }

    function toggleSort(col) {
      if (sortState.col === col) { sortState.order = sortState.order === 'asc' ? 'desc' : 'asc'; } 
      else { sortState.col = col; sortState.order = 'desc'; }
      applySort();
    }

    function applySort() {
      if (!currentDetailList || currentDetailList.length === 0) return;

      const iconType = document.getElementById('sort-icon-type');
      const iconScore = document.getElementById('sort-icon-score');
      if (iconType && iconScore) {
        iconType.innerHTML = '↕'; iconType.style.color = '#ccc';
        iconScore.innerHTML = '↕'; iconScore.style.color = '#ccc';
        
        const activeIcon = sortState.col === 'type' ? iconType : iconScore;
        activeIcon.innerHTML = sortState.order === 'asc' ? '▲' : '▼'; 
        activeIcon.style.color = '#2980b9';
      }

      currentDetailList.sort((a, b) => {
        let valA = a[sortState.col];
        let valB = b[sortState.col];

        if (sortState.col === 'type') {
          valA = (valA || "").toString();
          valB = (valB || "").toString();
        } else {
          valA = parseInt(valA || 0);
          valB = parseInt(valB || 0);
        }

        if (valA < valB) return sortState.order === 'asc' ? -1 : 1;
        if (valA > valB) return sortState.order === 'asc' ? 1 : -1;
        return 0;
      });

      const tbody = document.getElementById('detail-tbody');
      tbody.innerHTML = currentDetailList.map(item => {
        const typeName = item.type === "성취의미" ? "성취·의미" : item.type;
        const style = item.score >= 4 ? 'color:#c0392b; font-weight:bold;' : 'color:#555;';
        
        return `<tr>
          <td style="text-align:center;"><span style="background:#e2e8f0; color:#2c3e50; padding:4px 8px; border-radius:4px; font-weight:bold; font-size:0.8rem;">${typeName}</span></td>
          <td style="line-height:1.4;">${item.text}</td>
          <td style="text-align:center; ${style}">${item.score}점</td>
        </tr>`;
      }).join('');
    }

    function resetTest() {
      if (confirm("새로운 검사를 시작하시겠습니까?")) {
        localStorage.removeItem('ksip_last_result');
        sessionStorage.clear();
        // 깃허브 등 외부 호스팅용 새로고침 로직
        window.location.href = window.location.pathname;
      }
    }

    function callAI() {
      document.getElementById('ai-initial-view').style.display = 'none';
      document.getElementById('ai-loading').style.display = 'block';
      
      callBackend('generateAIAnalysis', finalResultData)
        .then(res => {
          document.getElementById('ai-loading').style.display = 'none';
          if (res.error) {
            const box = document.getElementById('ai-result-box');
            box.style.display = 'block';
            box.innerHTML = `<div style="color:red; padding:20px; border:1px solid red;">${res.error}</div>`;
          } else {
            renderAIResult(res);
            let savedData = JSON.parse(localStorage.getItem('ksip_last_result') || '{}');
            if (savedData.id) {
               callBackend('saveAIResult', { id: savedData.id, result: res });
            }
          }
        })
        .catch(err => {
          document.getElementById('ai-loading').style.display = 'none';
          alert("서버 연결 실패: " + err);
        });
    }

    function renderAIResult(res) {
      const resultBox = document.getElementById('ai-result-box');
      let initView = document.getElementById('ai-initial-view');
      if(initView) initView.style.display = 'none';
      
      resultBox.style.display = 'block';
      
      try {
        let savedData = JSON.parse(localStorage.getItem('ksip_last_result') || '{}');
        if (savedData.scores) { 
          savedData.aiResult = res;
          localStorage.setItem('ksip_last_result', JSON.stringify(savedData));
        }
      } catch(e) {}

      resultBox.innerHTML = `
        <div class="ai-result-grid">
          <div class="ai-box" style="border-top: 3px solid #2980b9;">
            <h4 style="color:#2980b9;">핵심 강점 및 잠재력</h4>
            <p>${res.strength.replace(/\n/g, '<br>')}</p>
          </div>
          <div class="ai-box" style="border-top: 3px solid #e74c3c;">
            <h4 style="color:#e74c3c;">내면의 그림자와 보완점</h4>
            <p>${res.weakness.replace(/\n/g, '<br>')}</p>
          </div>
          <div class="ai-box" style="border-top: 3px solid #27ae60;">
            <h4 style="color:#27ae60;">성장을 위한 조언</h4>
            <p>${res.advice.replace(/\n/g, '<br>')}</p>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
