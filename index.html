<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 최적화 (확대 방지 등) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>드림하이 색깔빙고</title>
  <style>
    /* CSS 변수 (라이트모드 - 푸른 하늘 테마 기본) */
    :root {
      --bg-gradient: linear-gradient(135deg, #E0F2FE 0%, #BAE6FD 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #1E293B;
      --text-sub: #475569;
      --input-bg: #FFFFFF;
      --input-border: #93C5FD;
      --btn-primary: linear-gradient(135deg, #38BDF8, #0EA5E9);
      --btn-hover: #0284C7;
      --header-color: #0369A1;
      
      /* 색깔빙고 스티커 색상 */
      --red: #FF4B4B; --blue: #4B8CFF; --yellow: #FFC800; --orange: #FF8C00; --green: #4CAF50;
    }

    /* 다크모드 (밤하늘 테마) */
    body.dark-mode {
      --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      --card-bg: rgba(30, 41, 59, 0.95);
      --text-main: #F8FAFC;
      --text-sub: #CBD5E1;
      --input-bg: #334155;
      --input-border: #475569;
      --btn-primary: linear-gradient(135deg, #0284C7, #0369A1);
      --btn-hover: #075985;
      --header-color: #38BDF8;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      margin: 0; padding: 0;
      transition: background 0.3s, color 0.3s;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* 상단 헤더 & 토글 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .theme-toggle { 
      background: var(--card-bg); border: none; border-radius: 50%;
      width: 40px; height: 40px; font-size: 20px; cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex; align-items: center; justify-content: center;
    }
    
    h1 { text-align: center; color: var(--header-color); margin-top: 0; font-size: 26px; font-weight: 800; }
    .subtitle { text-align: center; color: var(--text-sub); margin-bottom: 30px; font-size: 15px; }
    
    /* 1. 로그인 화면 */
    .login-box {
      background: var(--card-bg); padding: 30px 20px; border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative;
      text-align: center;
    }
    .btn-add {
      position: absolute; top: -15px; right: 15px;
      background: var(--btn-primary); color: white; border: none;
      width: 45px; height: 45px; border-radius: 50%;
      font-size: 28px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(14,165,233,0.4); cursor: pointer;
    }
    input.login-input {
      width: 100%; padding: 16px; border: 2px solid var(--input-border); border-radius: 12px;
      font-size: 18px; text-align: center; box-sizing: border-box; margin-bottom: 20px;
      background: var(--input-bg); color: var(--text-main); font-weight: bold;
    }
    .btn-login { 
      width: 100%; padding: 16px; background: var(--btn-primary); color: #fff; 
      border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    /* 2. 대시보드 화면 */
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .user-info { display: flex; flex-direction: column; align-items: flex-start; }
    .user-greeting { font-weight: 800; font-size: 18px; color: var(--header-color); }
    .btn-logout { 
      background: transparent; border: 1px solid var(--text-sub); color: var(--text-sub); 
      padding: 4px 10px; border-radius: 15px; font-size: 12px; margin-top: 5px; cursor: pointer;
    }
    .btn-write {
      width: 100%; padding: 18px; background: var(--btn-primary); border: none; border-radius: 15px;
      color: white; font-size: 18px; font-weight: bold; margin-bottom: 25px; 
      box-shadow: 0 8px 20px rgba(14,165,233,0.3); cursor: pointer;
    }
    
    /* 2열 빙고 그리드 */
    .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .bingo-card {
      background: var(--card-bg); padding: 15px 10px; border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center;
      border: 3px solid transparent; transition: transform 0.2s;
    }
    .bingo-card.my-card { border-color: var(--header-color); transform: translateY(-3px); }
    .card-name { font-weight: 800; font-size: 17px; margin-bottom: 12px; color: var(--text-main); }
    .stickers-display { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; font-size: 13px; font-weight: bold; }
    .sticker-badge { display: flex; align-items: center; background: rgba(150,150,150,0.1); padding: 4px 8px; border-radius: 12px; color: var(--text-main); }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    
    /* 공통 색상(다크/라이트 동일 적용) */
    .bg-red { background: var(--red); } .bg-blue { background: var(--blue); }
    .bg-yellow { background: var(--yellow); } .bg-orange { background: var(--orange); } .bg-green { background: var(--green); }

    /* 3. 체크 폼 화면 */
    .form-box { background: var(--card-bg); padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .btn-back { background: transparent; border: none; color: var(--text-sub); margin-bottom: 15px; font-size: 16px; padding: 0; cursor: pointer; font-weight: bold; }
    
    .form-section {
      margin-bottom: 25px; padding: 15px; border-radius: 12px; background: rgba(150,150,150,0.05); border-left: 5px solid #ccc;
    }
    .sec-basic { border-left-color: #64748B; } .sec-red { border-left-color: var(--red); }
    .sec-blue { border-left-color: var(--blue); } .sec-yellow { border-left-color: var(--yellow); }
    .sec-orange { border-left-color: var(--orange); } .sec-green { border-left-color: var(--green); }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 800; margin-bottom: 8px; color: var(--text-main); font-size: 15px; }
    .checkbox-label { display: flex; align-items: center; font-weight: 500; cursor: pointer; font-size: 15px; }
    .checkbox-label input { width: 22px; height: 22px; margin-right: 12px; accent-color: var(--header-color); }
    
    input[type="text"], textarea {
      width: 100%; padding: 14px; border: 1px solid var(--input-border); border-radius: 10px; 
      box-sizing: border-box; font-size: 15px; font-family: inherit;
      background: var(--input-bg); color: var(--text-main);
    }
    input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--header-color); }
    
    /* 로딩 오버레이 */
    #loading {
      display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
      flex-direction: column; color: white; font-size: 18px; font-weight: bold;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- 로딩 화면 -->
<div id="loading" style="display: none;">
  <div class="spinner"></div>
  <div id="loadingText">구름 위로 날아오르는 중... ☁️</div>
</div>

<div class="app-container">
  
  <!-- 공통 상단 툴바 (다크모드 토글) -->
  <div class="top-bar">
    <div style="width:40px;"></div> <!-- 중앙 정렬을 위한 빈 공간 -->
    <h1>☁️ 드림하이 색깔빙고</h1>
    <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- 1. 로그인 화면 -->
  <div id="screen-login" class="screen">
    <div class="subtitle">오늘도 높이 비상할 준비가 되었나요? 🚀</div>
    <div class="login-box">
      <button class="btn-add" onclick="addNewUser()" title="이름 추가하기">+</button>
      <input type="text" id="loginName" class="login-input" placeholder="이름을 입력하세요" onkeypress="if(event.key==='Enter') login()">
      <button class="btn-login" onclick="login()">입 장 하 기</button>
    </div>
  </div>

  <!-- 2. 대시보드 화면 -->
  <div id="screen-dashboard" class="screen">
    <div class="dashboard-header">
      <div class="user-info">
        <span id="currentUserDisplay" class="user-greeting"></span>
        <button class="btn-logout" onclick="logout()">다른 이름으로 로그인</button>
      </div>
    </div>
    <button class="btn-write" onclick="goForm()">오늘의 색깔빙고 제출하기 📝</button>
    
    <div id="bingoGrid" class="grid-container">
      <!-- 빙고 카드 렌더링 영역 -->
    </div>
  </div>

  <!-- 3. 체크 폼 화면 -->
  <div id="screen-form" class="screen">
    <button class="btn-back" onclick="goDashboard()">← 전체 현황판으로 돌아가기</button>
    
    <div class="form-box">
      <form id="bingoForm">
        <div class="form-section sec-basic">
          <div class="form-group">
            <label>담당 쌤</label>
            <input type="text" name="teacherName" placeholder="ex) 길우쌤 반">
          </div>
        </div>
        <!-- 빨강 -->
        <div class="form-section sec-red">
          <div class="form-group"><label class="checkbox-label"><input type="checkbox" name="arrive"> 1. [빨강] 10분 전 도착</label></div>
          <div class="form-group"><label class="checkbox-label"><input type="checkbox" name="loud"> 2. [빨강] 크게 화답하기</label></div>
        </div>
        <!-- 파랑 -->
        <div class="form-section sec-blue">
          <div class="form-group"><label>3. [파랑] 봉사</label><input type="text" name="service" placeholder="봉사 내용"></div>
          <div class="form-group"><label>4. [파랑] 후원</label><input type="text" name="sponsor" placeholder="후원 내용"></div>
        </div>
        <!-- 노랑(기도) -->
        <div class="form-section sec-yellow">
          <label>5. [노랑] 기도</label>
          <div class="form-group"><label class="checkbox-label"><input type="checkbox" name="pray1"> 1) 하나님께 기도했나요?</label></div>
          <div class="form-group"><input type="text" name="pray2" placeholder="2) 감사한 내용"></div>
          <div class="form-group"><input type="text" name="pray3" placeholder="3) 회개 (용서해주세요)"></div>
          <div class="form-group"><input type="text" name="pray4" placeholder="4) 간구 (도와주세요)"></div>
          <div class="form-group"><label class="checkbox-label"><input type="checkbox" name="pray5"> 5) 예수님의 이름으로 기도드립니다. 아멘</label></div>
        </div>
        <!-- 주황 -->
        <div class="form-section sec-orange">
          <div class="form-group"><label>6. [주황] 칭찬</label><input type="text" name="compliment" placeholder="누구에게 어떻게 칭찬했나요?"></div>
        </div>
        <!-- 초록 -->
        <div class="form-section sec-green">
          <div class="form-group"><label>7. [초록] 성경읽기</label><textarea name="bible" placeholder="느낀점" rows="3"></textarea></div>
        </div>
        <button type="submit" class="btn-login" style="margin-top:10px;">제출 완료하기 🚀</button>
      </form>
    </div>
  </div>

</div>

<script>
  // ★ 백엔드 배포 URL을 여기에 넣어주세요 ★
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFEQeooBhbPXET0ujyBiWoAp0WMxXiI6BEVbox667uUVTn_yKJye1fYJDKtCLt9kCV2Q/exec';
  
  let currentUser = '';

  // 앱 초기화 (테마 및 자동 로그인 체크)
  document.addEventListener("DOMContentLoaded", () => {
    // 테마 체크
    if(localStorage.getItem('dreamHighTheme') === 'dark') {
      document.body.classList.add('dark-mode');
      document.getElementById('themeToggle').innerText = '☀️';
    }
    
    // 자동 로그인 체크 (캐시)
    const savedName = localStorage.getItem('dreamHighUser');
    if(savedName) {
      currentUser = savedName;
      document.getElementById('currentUserDisplay').innerText = `✨ ${currentUser}님`;
      loadDashboard();
    } else {
      switchScreen('screen-login');
    }
  });

  // 다크모드/라이트모드 토글
  function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    document.getElementById('themeToggle').innerText = isDark ? '☀️' : '🌙';
    localStorage.setItem('dreamHighTheme', isDark ? 'dark' : 'light');
  }

  // 화면 전환 함수
  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // 로딩 UI 제어
  function showLoading(show, text="처리 중입니다...") {
    document.getElementById('loadingText').innerText = text;
    document.getElementById('loading').style.display = show ? 'flex' : 'none';
  }

  // API 호출 공통 함수
  async function callAPI(action, dataObj = {}) {
    const payload = { action: action, ...dataObj };
    const formData = new URLSearchParams();
    formData.append('payload', JSON.stringify(payload));

    try {
      const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
      return await response.json();
    } catch (e) {
      console.error(e);
      return { success: false, message: '네트워크 오류가 발생했습니다.' };
    }
  }

  // 1. 로그인
  async function login() {
    const name = document.getElementById('loginName').value.trim();
    if(!name) return alert('이름을 입력해주세요.');
    
    showLoading(true, "로그인 중입니다... ☁️");
    const res = await callAPI('login', { name: name });
    showLoading(false);

    if(res.success) {
      currentUser = name;
      localStorage.setItem('dreamHighUser', name); // 유저 정보 로컬 저장(캐시)
      document.getElementById('currentUserDisplay').innerText = `✨ ${currentUser}님`;
      loadDashboard();
    } else {
      alert(res.message);
    }
  }

  // 2. 로그아웃 (캐시 삭제)
  function logout() {
    localStorage.removeItem('dreamHighUser');
    currentUser = '';
    document.getElementById('loginName').value = '';
    switchScreen('screen-login');
  }

  // 3. 새 유저 추가 (+)
  async function addNewUser() {
    const name = prompt("새로운 참가자의 이름을 입력하세요.");
    if(!name || name.trim() === '') return;
    
    showLoading(true, "이름을 등록하고 있습니다... ☁️");
    const res = await callAPI('addUser', { name: name.trim() });
    showLoading(false);

    if(res.success) {
      alert(`환영합니다! ${name.trim()}님의 공간이 만들어졌습니다. 이름을 입력하고 입장해주세요!`);
    } else {
      alert(res.message);
    }
  }

  // 4. 대시보드 로드
  async function loadDashboard() {
    showLoading(true, "친구들의 빙고 현황을 불러오는 중... ☁️");
    const res = await callAPI('getDashboard');
    showLoading(false);

    if(res.success) {
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = '';
      
      res.data.forEach(user => {
        const isMe = user.name === currentUser;
        const st = user.stickers;
        
        const card = document.createElement('div');
        card.className = `bingo-card ${isMe ? 'my-card' : ''}`;
        card.innerHTML = `
          <div class="card-name">${user.maskedName}</div>
          <div class="stickers-display">
            <span class="sticker-badge"><span class="dot bg-red"></span>${st.red}</span>
            <span class="sticker-badge"><span class="dot bg-blue"></span>${st.blue}</span>
            <span class="sticker-badge"><span class="dot bg-yellow"></span>${st.yellow}</span>
            <span class="sticker-badge"><span class="dot bg-orange"></span>${st.orange}</span>
            <span class="sticker-badge"><span class="dot bg-green"></span>${st.green}</span>
          </div>
        `;
        grid.appendChild(card);
      });
      switchScreen('screen-dashboard');
    }
  }

  function goForm() { switchScreen('screen-form'); }
  function goDashboard() { switchScreen('screen-dashboard'); }

  // 5. 폼 제출
  document.getElementById('bingoForm').addEventListener('submit', async e => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const dataObj = Object.fromEntries(formData.entries());
    
    showLoading(true, "색깔빙고를 전송하고 있습니다... 🚀");
    const res = await callAPI('submitForm', { name: currentUser, data: dataObj });
    showLoading(false);

    if(res.success) {
      alert('성공적으로 기록되었습니다! 수고하셨습니다 👏');
      e.target.reset();
      loadDashboard();
    } else {
      alert('제출에 실패했습니다. 관리자에게 문의해주세요.');
    }
  });
</script>

</body>
</html>
